[workspace]
resolver = "2"
members = [
    "config",
    "core",
    "render",
    "feature",
    "resources",
    "lua",
    "loader",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Leek"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = { version = "1", features = ["import"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.12"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
mlua = { version = "0.12", features = ["luajit52", "vendored", "send"] }
wallbang_config = { path = "config" }
wallbang_core = { path = "core" }
wallbang_render = { path = "render" }
wallbang_feature = { path = "feature" }
wallbang_resources = { path = "resources" }
wallbang_lua = { path = "lua" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
